<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Store logo placeholder">
  <!-- Neutral shop-logo placeholder: a simple gem mark. Deliberately contains
       no shop name, initials or brand colors so it can never masquerade as a
       specific shop's logo. Customer flows replace it with a themed monogram. -->
  <rect x="0" y="0" width="200" height="200" rx="48" fill="#f4f0ea" />
  <g stroke="#a89f94" stroke-width="6" stroke-linejoin="round" fill="none">
    <path d="M100 52 L140 84 L100 148 L60 84 Z" />
    <path d="M60 84 L140 84" />
    <path d="M100 52 L84 84 L100 148 L116 84 Z" />
  </g>
</svg>
