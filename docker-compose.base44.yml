services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=gift
      - POSTGRES_PASSWORD=gift
      - POSTGRES_DB=gift
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gift -d gift"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: on-failure

  api:
    image: node:22
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - DATABASE_URL=postgres://gift:gift@db:5432/gift
      - PORT=4000
      - NODE_ENV=development
      # JWT_SECRET is delivered by the platform via /run/base44/app.env (see env_file below).
      - BASE44_PREVIEW_MODE
    env_file:
      - /run/base44/app.env
    command: ["sh", "-ec", "npm install --no-audit --no-fund && node src/seed.js && exec node --watch src/server.js"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: on-failure

  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - BASE44_PREVIEW_MODE=1
      # Vite >= 6.1 appends this to its allowedHosts list so the preview proxy host is accepted.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # The dev server proxies /api to the backend (single-origin, so cookies work).
      - VITE_API_PROXY_TARGET=http://api:4000
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 5173"]
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure

volumes:
  node_modules:
  backend_node_modules:
  db_data:
