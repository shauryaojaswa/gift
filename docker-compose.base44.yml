services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - BASE44_PREVIEW_MODE=1
      # Vite >= 6.1 appends this to its allowedHosts list so the preview proxy host is accepted.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm install && exec npx vite --host 0.0.0.0 --port 5173"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure

volumes:
  node_modules:
